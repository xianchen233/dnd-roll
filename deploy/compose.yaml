name: dnd-roll
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd_roll}
      POSTGRES_USER: ${POSTGRES_USER:-dnd_roll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ image uses a versioned PGDATA below this parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    # Database remains on the private Compose network; no host port is published.
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dnd_roll}
      DATABASE_USERNAME: ${POSTGRES_USER:-dnd_roll}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DEMO_DM_USERNAME: ${DEMO_DM_USERNAME:-dm}
      DEMO_DM_PASSWORD: ${DEMO_DM_PASSWORD:-}
      DEMO_PLAYER_USERNAME: ${DEMO_PLAYER_USERNAME:-player}
      DEMO_PLAYER_PASSWORD: ${DEMO_PLAYER_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # This service is reachable only through the trusted Compose web proxy.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    depends_on:
      - backend
volumes:
  postgres_data:
