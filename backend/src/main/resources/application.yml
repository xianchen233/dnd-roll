spring:
  application:
    name: dnd-roll
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dnd_roll}
    username: ${DATABASE_USERNAME:dnd_roll}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
assets:
  storage-root: ${ASSET_STORAGE_ROOT:.runtime/assets}
server:
  shutdown: graceful
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
