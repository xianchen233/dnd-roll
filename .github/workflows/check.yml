name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/check-contracts.mjs
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: dnd_roll_test
          POSTGRES_USER: dnd_test
          POSTGRES_PASSWORD: ci-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dnd_test -d dnd_roll_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/dnd_roll_test
      TEST_DATABASE_USERNAME: dnd_test
      TEST_DATABASE_PASSWORD: ci-database-only
      BACKUP_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      BACKUP_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install matching-major PostgreSQL archive clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - run: ./mvnw -B -ntp -Pintegration verify
        working-directory: backend
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
  browser:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: dnd_roll_browser
      POSTGRES_USER: dnd_test
      POSTGRES_PASSWORD: ci-database-only
      SPRING_PROFILES_ACTIVE: demo
      DEMO_DM_USERNAME: browser-dm
      DEMO_DM_PASSWORD: ci-browser-dm-only
      DEMO_PLAYER_USERNAME: browser-player
      DEMO_PLAYER_PASSWORD: ci-browser-player-only
      E2E_DM_USERNAME: browser-dm
      E2E_DM_PASSWORD: ci-browser-dm-only
      E2E_PLAYER_USERNAME: browser-player
      E2E_PLAYER_PASSWORD: ci-browser-player-only
      E2E_BASE_URL: http://localhost:8080
      BACKUP_OPERATOR_USERNAME: browser-dm
      BACKUPS_DAILY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start standard Compose deployment
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml up --build -d
          curl --fail --retry 40 --retry-delay 3 --retry-all-errors --max-time 5 --retry-max-time 120 http://localhost:8080/api/auth/csrf > /dev/null
      - run: npm run test:e2e
        working-directory: frontend
      - name: Verify ten persistence groups across backend and PostgreSQL restart
        run: |
          node scripts/check-asset-restart.mjs seed "$RUNNER_TEMP/asset-restart.json"
          node scripts/check-token-restart.mjs seed "$RUNNER_TEMP/token-restart.json"
          node scripts/check-map-restart.mjs seed "$RUNNER_TEMP/map-restart.json"
          node scripts/check-p02-restart.mjs seed "$RUNNER_TEMP/p02-restart.json"
          node scripts/check-character-restart.mjs seed "$RUNNER_TEMP/character-restart.json"
          node scripts/check-content-restart.mjs seed "$RUNNER_TEMP/content-restart.json"
          node scripts/check-dice-restart.mjs seed "$RUNNER_TEMP/dice-restart.json"
          node scripts/check-combat-restart.mjs seed "$RUNNER_TEMP/combat-restart.json"
          node scripts/check-timeline-restart.mjs seed "$RUNNER_TEMP/timeline-restart.json"
          node scripts/check-notes-restart.mjs seed "$RUNNER_TEMP/notes-restart.json"
          docker compose -f deploy/compose.yaml restart db
          docker compose -f deploy/compose.yaml up -d --wait db
          docker compose -f deploy/compose.yaml restart backend
          curl --fail --retry 40 --retry-delay 3 --retry-all-errors --max-time 5 --retry-max-time 120 http://localhost:8080/api/auth/csrf > /dev/null
          node scripts/check-asset-restart.mjs verify "$RUNNER_TEMP/asset-restart.json"
          node scripts/check-token-restart.mjs verify "$RUNNER_TEMP/token-restart.json"
          node scripts/check-map-restart.mjs verify "$RUNNER_TEMP/map-restart.json"
          node scripts/check-p02-restart.mjs verify "$RUNNER_TEMP/p02-restart.json"
          node scripts/check-character-restart.mjs verify "$RUNNER_TEMP/character-restart.json"
          node scripts/check-content-restart.mjs verify "$RUNNER_TEMP/content-restart.json"
          node scripts/check-dice-restart.mjs verify "$RUNNER_TEMP/dice-restart.json"
          node scripts/check-combat-restart.mjs verify "$RUNNER_TEMP/combat-restart.json"
          node scripts/check-timeline-restart.mjs verify "$RUNNER_TEMP/timeline-restart.json"
          node scripts/check-notes-restart.mjs verify "$RUNNER_TEMP/notes-restart.json"
      - name: Restore a complete migration archive into a separate Compose project
        run: |
          for group in asset token map p02 character content dice combat timeline notes; do
            node "scripts/check-$group-restart.mjs" seed "$RUNNER_TEMP/restore-$group.json"
          done
          node scripts/check-pending-backup.mjs capture "$RUNNER_TEMP/restore-pending.json"
          node scripts/check-backup.mjs "$RUNNER_TEMP/deployment-backup.zip" migration
          docker compose -f deploy/compose.yaml stop backend
          docker compose -f deploy/compose.yaml cp backend:/var/lib/dnd-roll/backups/write-fence "$RUNNER_TEMP/source-write-fence"
          export APP_PORT=8081
          export ASSET_STORAGE_ROOT=/var/lib/dnd-roll/assets/restored
          docker compose -p dnd-roll-restored -f deploy/compose.yaml build backend web
          docker compose -p dnd-roll-restored -f deploy/compose.yaml up -d --wait db
          export RESTORE_DATABASE_URL="jdbc:postgresql://db:5432/$POSTGRES_DB"
          export RESTORE_DATABASE_USERNAME="$POSTGRES_USER"
          export RESTORE_DATABASE_PASSWORD="$POSTGRES_PASSWORD"
          docker compose -p dnd-roll-restored -f deploy/compose.yaml run --rm --no-deps --entrypoint java -v "$RUNNER_TEMP/deployment-backup.zip:/restore/backup.zip:ro" -e RESTORE_DATABASE_URL -e RESTORE_DATABASE_USERNAME -e RESTORE_DATABASE_PASSWORD backend -Dloader.main=io.dndroll.backup.RestoreCommand -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher /restore/backup.zip /var/lib/dnd-roll/assets/restored
          docker compose -p dnd-roll-restored -f deploy/compose.yaml up -d backend web
          curl --fail --retry 40 --retry-delay 3 --retry-all-errors --max-time 5 --retry-max-time 120 http://localhost:8081/api/auth/csrf > /dev/null
          export E2E_BASE_URL=http://localhost:8081
          node scripts/check-pending-backup.mjs verify "$RUNNER_TEMP/restore-pending.json"
          for group in asset token map p02 character content dice combat timeline notes; do
            node "scripts/check-$group-restart.mjs" verify "$RUNNER_TEMP/restore-$group.json"
          done
      - name: Save container logs
        if: always()
        run: |
          docker compose -f deploy/compose.yaml logs --no-color > compose.log
          APP_PORT=8081 docker compose -p dnd-roll-restored -f deploy/compose.yaml logs --no-color > restored-compose.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-test-reports
          path: |
            frontend/test-results
            frontend/playwright-report
            compose.log
            restored-compose.log
